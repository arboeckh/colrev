<!doctype html>
<!--
  The preview's page (scripts/agentixxx/preview.sh): the app's VNC display, through noVNC's RFB
  module, filling the browser window. The display follows the window's size, so the app is laid
  out for it, and is SCALE times as many pixels as the window has CSS pixels, with the app
  rendering at that device scale factor: on a 2x screen, one display pixel per screen pixel.
  noVNC's own option for this (resizeSession) asks for the window's size in CSS pixels, so the
  page asks for the size itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColRev preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f5; }
  #screen { position: fixed; inset: 0; }
  #status {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font: 13px/1.4 system-ui, sans-serif; color: #fff; background: rgb(0 0 0 / 0.7);
    padding: 6px 12px; border-radius: 6px;
  }
  #status:empty { display: none; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="status">Connecting…</div>
<script type="module">
import RFB from './core/rfb.js';

/** The app's device scale factor (`--force-device-scale-factor` in preview.sh). */
const SCALE = 2;
/** The largest display side asked for; past it noVNC scales the display down to the window. */
const MAX_SIDE = 4096;

const status = document.getElementById('status');
const url = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/websockify`;

/**
 * noVNC (1.3) asks for a new size from `_requestRemoteResize`, once the server has said it can
 * resize and after each window resize; this replaces it with one that asks for SCALE times the
 * window. It is noVNC's private method, so a newer noVNC that renames it falls back to a display
 * of the window's CSS size: still laid out for the window, only not sharper. noVNC calls it on
 * the server's first word that it can resize before it has read the screen's id from that word,
 * and the server refuses a request with the wrong id, so the request waits a turn.
 */
function askForScaledSize() {
  clearTimeout(this._resizeTimeout);
  this._resizeTimeout = null;
  if (!this._supportsSetDesktopSize) return;
  setTimeout(() => {
    const width = Math.min(MAX_SIDE, Math.round(window.innerWidth * SCALE));
    const height = Math.min(MAX_SIDE, Math.round(window.innerHeight * SCALE));
    RFB.messages.setDesktopSize(this._sock, width, height, this._screenID, this._screenFlags);
  }, 0);
}

function connect() {
  const rfb = new RFB(document.getElementById('screen'), url);
  if (typeof rfb._requestRemoteResize === 'function') rfb._requestRemoteResize = askForScaledSize;
  rfb.scaleViewport = true;
  rfb.resizeSession = true;
  rfb.qualityLevel = 9;
  rfb.compressionLevel = 2;
  rfb.addEventListener('connect', () => {
    status.textContent = '';
    rfb.focus();
  });
  rfb.addEventListener('disconnect', () => {
    status.textContent = 'Disconnected: reconnecting…';
    setTimeout(connect, 2000);
  });
}

connect();
</script>
</body>
</html>
